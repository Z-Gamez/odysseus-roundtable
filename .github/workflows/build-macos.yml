name: Build macOS app

# Builds the standalone Odysseus.app (Apple Silicon) with PyInstaller and
# packages it as a drag-to-Applications DMG. PyInstaller cannot cross-compile,
# so this runs on a macOS runner. Trigger manually; pass a release tag to
# attach the DMG to that GitHub release.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the DMG to (blank = artifact only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon (arm64)
    steps:
      # Pinned by commit SHA like every other workflow here: a moving tag
      # silently changed what ran, and floating @v4/@v5 kept this job on the
      # deprecated Node 20 runtime that GitHub is removing.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # checkout leaves the job's token in .git/config by default, where an
          # artifact upload of the workspace would carry it out of the run. This
          # job only reads the tree and pushes nothing, so it never needs it.
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview pillow playwright

      - name: Generate .icns from the Windows icon
        run: |
          python - <<'EOF'
          from PIL import Image
          import os
          os.makedirs("icon.iconset", exist_ok=True)
          src = Image.open("static/odysseus.ico").convert("RGBA")
          for s in (16, 32, 64, 128, 256, 512):
              src.resize((s, s), Image.LANCZOS).save(f"icon.iconset/icon_{s}x{s}.png")
              src.resize((s*2, s*2), Image.LANCZOS).save(f"icon.iconset/icon_{s}x{s}@2x.png")
          EOF
          mkdir -p installer
          iconutil -c icns icon.iconset -o installer/odysseus.icns

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm OdysseusMac.spec

      - name: Sign the app
        # LAST step that touches the bundle — anything written afterwards
        # breaks the seal ("a sealed resource is missing or invalid").
        #
        # macOS TCC keys permissions to the signing identity. With an ad-hoc
        # signature there is no Team ID, so TCC falls back to the cdhash, which
        # changes every build — each rebuild reads as a DIFFERENT app and the
        # user's Contacts and Automation grants are silently dropped and
        # re-prompted. A stable identity fixes that; ad-hoc cannot.
        #
        # Set the MACOS_SIGN_IDENTITY secret (a Developer ID Application cert,
        # or a self-signed code-signing cert imported into the runner keychain)
        # to get a stable designated requirement. Without it this falls back to
        # ad-hoc so the build still produces a runnable app — but permissions
        # will keep resetting, which is the known cost.
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -n "$SIGN_IDENTITY" ]; then
            echo "Signing with a stable identity"
            codesign --force --deep --options runtime \
                     --sign "$SIGN_IDENTITY" dist/Odysseus.app
          else
            echo "::warning::No MACOS_SIGN_IDENTITY secret — signing ad-hoc. macOS will re-prompt for Contacts/Automation after every rebuild."
            codesign --force --deep -s - dist/Odysseus.app
          fi

      - name: Verify signature integrity
        # An invalid signature ALSO produces macOS's "app is damaged" dialog,
        # so prove the bundle verifies before shipping. (Gatekeeper will still
        # quarantine the download — un-notarized apps need `xattr -cr` or
        # Privacy & Security -> Open Anyway on first launch; that part is
        # documented, not fixable without an Apple Developer account.)
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Odysseus.app
          codesign -dv dist/Odysseus.app 2>&1 | head -8

          # Fail the build if anything wrote into the bundle after signing —
          # that is what silently resets the user's macOS permissions, and it
          # is invisible unless checked. saw.db and the Playwright cache both
          # used to land here.
          if find dist/Odysseus.app -name "*.db" -o -name "*.db-wal" | grep -q .; then
            echo "::error::A database was written inside the app bundle — this breaks the signature seal and resets TCC permissions on every rebuild."
            find dist/Odysseus.app \( -name "*.db" -o -name "*.db-wal" \) -print
            exit 1
          fi
          if [ -d dist/Odysseus.app/Contents/Frameworks/data/local ]; then
            echo "::error::Runtime cache directory found inside the app bundle."
            exit 1
          fi

      - name: Smoke test the frozen server
        run: |
          ODYSSEUS_PORT=7100 ./dist/Odysseus.app/Contents/MacOS/Odysseus --server > server.log 2>&1 &
          echo $! > server.pid
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7100/ || true)
            if [ "$code" = "302" ] || [ "$code" = "200" ]; then break; fi
            sleep 3
          done
          echo "server answered: $code"
          if [ "$code" != "302" ] && [ "$code" != "200" ]; then
            echo "frozen server never came up"; tail -40 server.log; exit 1
          fi
          curl -s http://127.0.0.1:7100/static/sw.js | grep -q "odysseus-v" || { echo "static broken"; exit 1; }
          # Identity marker the launchers use to tell Odysseus apart from a
          # port squatter (macOS AirPlay answers 403 on 7000).
          curl -s -D - -o /dev/null http://127.0.0.1:7100/api/health | grep -qi "x-odysseus: 1" || { echo "health identity marker missing"; exit 1; }

      - name: Verify frozen python emulation (no GUI on -c/-m)
        run: |
          ./dist/Odysseus.app/Contents/MacOS/Odysseus -c "print('emulation-ok')" | grep -q emulation-ok
          echo "def ok(): pass" > /tmp/gate_ok.py
          ./dist/Odysseus.app/Contents/MacOS/Odysseus -m py_compile /tmp/gate_ok.py
          echo "def broken(:" > /tmp/gate_bad.py
          if ./dist/Odysseus.app/Contents/MacOS/Odysseus -m py_compile /tmp/gate_bad.py 2>/dev/null; then
            echo "bad file compiled — dispatch broken"; exit 1
          fi
          echo "frozen python emulation verified"

      - name: Probe the frameless window (controls visible + wired)
        timeout-minutes: 6
        env:
          PROBE_URL: http://127.0.0.1:7100
        run: python scripts/macos_window_probe.py

      - name: Stop smoke server
        if: always()
        run: kill "$(cat server.pid 2>/dev/null)" 2>/dev/null || true

      - name: Package DMG
        run: |
          mkdir -p dmg-staging
          cp -R dist/Odysseus.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          # hdiutil intermittently fails with "Resource busy" on hosted runners
          # when a previous attach hasn't fully released; it is transient and a
          # plain re-run succeeds. Retry rather than burning a whole rebuild:
          # detach any stale Odysseus volume, back off, try again.
          for attempt in 1 2 3; do
            if hdiutil create -volname "Odysseus" -srcfolder dmg-staging -ov \
                 -format UDZO Odysseus-macOS-arm64.dmg; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "hdiutil create failed after 3 attempts" >&2
              exit 1
            fi
            echo "hdiutil create failed (attempt $attempt) — detaching and retrying"
            hdiutil detach "/Volumes/Odysseus" -force 2>/dev/null || true
            sleep 10
          done
          ls -lh Odysseus-macOS-arm64.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Odysseus-macOS-arm64
          path: Odysseus-macOS-arm64.dmg

      - name: Attach to release
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as an env var, never interpolated into the script body: a
          # ${{ }} expansion is substituted as raw text BEFORE the shell parses
          # the line, so a tag containing shell metacharacters would execute
          # rather than be treated as a tag. Quoting the expansion does not help;
          # only keeping it out of the source does.
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" Odysseus-macOS-arm64.dmg --clobber
